name: cutstorm

services:
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      # Default model is loaded into RAM on container startup (warmup).
      # Must match what the frontend requests by default so the first
      # transcribe hits cached model.
      WHISPER_MODEL: small
      WHISPER_COMPUTE: int8
      WHISPER_DEVICE: cpu
      # huggingface_hub network timeouts (read at import time): fail fast on
      # dead sockets instead of hanging the model load forever. The app also
      # has its own stall watchdog + retries on top (transcribe.py).
      HF_HUB_DOWNLOAD_TIMEOUT: "15"
      HF_HUB_ETAG_TIMEOUT: "15"
      # Evict cached whisper/alignment models after this many seconds without
      # transcription activity (frees ~3 GB while editing/exporting). 0 = off.
      WHISPER_UNLOAD_AFTER_SEC: "900"
      MAX_UPLOAD_BYTES: "107374182400"

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    volumes:
      - ./data:/data
    environment:
      WHISPER_MODEL: tiny
      WHISPER_COMPUTE: int8
      WHISPER_DEVICE: cpu
      WHISPERX_SKIP_ALIGN: "1"
    command: ["/scripts/docker-test.sh"]
